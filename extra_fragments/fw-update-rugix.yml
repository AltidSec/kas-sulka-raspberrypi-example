header:
  version: 1
target:
  - core-image-base
local_conf_header:
  60-kas-sulka-rugix: |
    DISTRO_FEATURES:append = " rugix "
    IMAGE_FSTYPES:append = " rugixb rugixb.hash"
    # Install rugix packages
    IMAGE_INSTALL:append = " rugix-ctrl rugix-bootstrapping-conf rugix-system-conf "
    # Install disk utilities for rugix bootstrap
    IMAGE_INSTALL:append = " util-linux-sfdisk e2fsprogs  "
    # Install packages to allow modifying u-boot environment
    IMAGE_INSTALL:append = " u-boot-env libubootenv-bin "
    WKS_FILE = "sdimage-rugix-rpi-uboot.wks.in"
repos:
  meta-rugix:
    url: https://github.com/silitics/meta-rugix.git
    branch: wrynose
    commit: be382e6a9bc32a80e26a16e2637a088ed8526fa8
    layers:
      meta-rugix-core:
      meta-rugix-rpi-uboot:

