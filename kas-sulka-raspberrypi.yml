header:
  version: 1
machine: raspberrypi4-64
local_conf_header:
  60-kas-sulka-raspberrypi: |
    LICENSE_FLAGS_ACCEPTED:append = "synaptics-killswitch"
    ENABLE_UART = "1"
    RPI_USE_U_BOOT = "1"
    # wic fstab update messes up the SELinux labels, so disable it
    WIC_CREATE_EXTRA_ARGS:append = " --no-fstab-update "
repos:
  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi.git
    commit: aaf976a665daa7e520545908adef8a0e9410b57f
    branch: scarthgap
  meta-sulka-raspberrypi:
    url: https://codeberg.org/AltidSec/meta-sulka-raspberrypi.git
    tag: 0.5.0
    commit: b622a51f0040a3db915d9a0866dbc78da4e3a637
